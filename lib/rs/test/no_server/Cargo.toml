# Builds generated code for IDLs without services against the library without
# its default features, which include the server module.

[package]
name = "kitchen-sink-no-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Apache Thrift Developers <dev@thrift.apache.org>"]
publish = false

[dependencies]
uuid = "1"

[dependencies.thrift]
path = "../../"
default-features = false
features = ["json"]
